<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Desk -->
  <rect width="900" height="600" fill="#f1f5f9" />

  <!-- Receipt Paper -->
  <rect x="30" y="30" width="840" height="540" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Top Blue Accent Bar -->
  <rect x="30" y="30" width="840" height="8" rx="4" fill="#2563eb" />

  <!-- Header -->
  <text x="60" y="80" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">КВИТАНЦИЯ ОБ ОПЛАТЕ</text>
  <text x="60" y="105" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#64748b">Электронный документ / Подтверждение проведения операции</text>

  <!-- Bank / Organization Info -->
  <text x="580" y="75" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">ПАО "СБЕРБАНК"</text>
  <text x="580" y="95" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#64748b">БИК: 044525225 | К/с: 30101810400000000225</text>
  <text x="580" y="115" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#64748b">ИНН: 7707083893 / КПП: 773601001</text>

  <line x1="60" y1="135" x2="840" y2="135" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Key Target Fields Highlight Box (Receipt Number and Date) -->
  <rect x="60" y="155" width="780" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Field 1: Номер квитанции Label -->
  <text x="90" y="185" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="0.5">НОМЕР КВИТАНЦИИ / ДОКУМЕНТА:</text>

  <!-- Field 2: Дата квитанции Label -->
  <text x="490" y="185" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-transform="uppercase" letter-spacing="0.5">ДАТА И ВРЕМЯ ОПЕРАЦИИ:</text>

  <!-- Details Section -->
  <text x="90" y="275" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#64748b">Получатель платежа:</text>
  <text x="260" y="275" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">ООО "МОСЭНЕРГОСБЫТ"</text>

  <text x="90" y="315" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#64748b">Лицевой счет (Л/С):</text>
  <text x="260" y="315" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b">7492-019-3381</text>

  <text x="90" y="355" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#64748b">Назначение платежа:</text>
  <text x="260" y="355" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#1e293b">Оплата коммунальных услуг за текущий период</text>

  <text x="90" y="395" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#64748b">Плательщик:</text>
  <text x="260" y="395" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#1e293b">Алексеев М. В.</text>

  <line x1="60" y1="425" x2="840" y2="425" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Total Amount Section -->
  <text x="90" y="465" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#64748b">СУММА ПЛАТЕЖА:</text>
  <text x="260" y="468" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#10b981">4 850.00 руб.</text>

  <text x="90" y="505" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#64748b">Комиссия:</text>
  <text x="260" y="505" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#64748b">0.00 руб.</text>

  <text x="90" y="535" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#64748b">Статус:</text>
  <text x="260" y="535" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">ИСПОЛНЕНО</text>

  <!-- Digital Stamp Stamp / Seal -->
  <rect x="620" y="445" width="200" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,3" />
  <text x="720" y="475" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8">ОПЛАЧЕНО ОНЛАЙН</text>
  <text x="720" y="495" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#3b82f6">ЭЦП ПАО СБЕРБАНК</text>
  <text x="720" y="515" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#64748b">Шлюз: 489-01-A9</text>
</svg>
