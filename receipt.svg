<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <filter id="rcpt-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="#0f172a" />

  <!-- Receipt Paper -->
  <rect x="50" y="40" width="500" height="820" rx="4" fill="#ffffff" filter="url(#rcpt-shadow)" />

  <!-- Zig-zag / receipt decorative top -->
  <line x1="70" y1="130" x2="530" y2="130" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Header -->
  <text x="300" y="85" text-anchor="middle" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#1e293b">КАССОВЫЙ ЧЕК</text>
  <text x="300" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#64748b">ООО "ЭКСПРЕСС СЕРВИС"</text>

  <!-- Receipt Fields -->
  <text x="80" y="180" font-family="'Courier New', monospace" font-size="15" fill="#64748b">ОПЕРАЦИЯ:</text>
  <text x="80" y="230" font-family="'Courier New', monospace" font-size="15" fill="#64748b">НОМЕР ЧЕКА:</text>
  <text x="80" y="280" font-family="'Courier New', monospace" font-size="15" fill="#64748b">ДАТА И ВРЕМЯ:</text>
  <text x="80" y="330" font-family="'Courier New', monospace" font-size="15" fill="#64748b">КЛИЕНТ:</text>

  <line x1="70" y1="370" x2="530" y2="370" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Line items header -->
  <text x="80" y="420" font-family="'Courier New', monospace" font-size="15" fill="#334155" font-weight="bold">УСЛУГА: ОПЛАТА ЗАКАЗА</text>

  <line x1="70" y1="520" x2="530" y2="520" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Total -->
  <text x="80" y="580" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#0f172a">ИТОГО К ОПЛАТЕ:</text>

  <!-- Payment method -->
  <text x="80" y="640" font-family="'Courier New', monospace" font-size="14" fill="#64748b">СПОСОБ ОПЛАТЫ: БЕЗНАЛИЧНЫЙ</text>
  <text x="80" y="670" font-family="'Courier New', monospace" font-size="14" fill="#64748b">СТАТУС: ОДОБРЕНО</text>

  <!-- Barcode / Footer -->
  <rect x="150" y="730" width="300" height="50" fill="#1e293b" opacity="0.85" rx="2" />
  <text x="300" y="762" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" letter-spacing="4">||| | |||| || ||||| || |</text>
  <text x="300" y="810" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">СПАСИБО ЗА ПОКУПКУ!</text>
</svg>
